name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Every runner on the ballix-infra VPS shares this label set; isolation comes from the
    # per-repo runner scope, so nothing more specific exists to select.
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The self-hosted runner is dedicated to this repo and keeps its Gradle home on a
          # named volume, so the action's own cache layer has nothing to add. Left enabled it
          # finds the pre-existing home and warns that caching was skipped on every run.
          cache-disabled: true

      - name: Build, lint and test
        env:
          # karoo-ext resolves only from GitHub Packages, which requires auth even though the
          # package is public. The automatic GITHUB_TOKEN is scoped to this repo and cannot read
          # another org's packages, so GPR_KEY must be a PAT with read:packages.
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: ./gradlew assembleDebug lint test
