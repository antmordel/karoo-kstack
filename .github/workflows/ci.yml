name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Every runner on the ballix-infra VPS shares this label set; isolation comes from the
    # per-repo runner scope, so nothing more specific exists to select.
    runs-on: [self-hosted, linux, x64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: DIAG gradle home state
        run: |
          echo "HOME=$HOME GRADLE_USER_HOME=${GRADLE_USER_HOME:-unset}"
          echo "--- /root/.gradle exists?"; ls -la /root/.gradle 2>&1 | head -20
          echo "--- wrapper dists"; ls -la /root/.gradle/wrapper/dists 2>&1 | head
          echo "--- caches/modules-2 size"; du -sh /root/.gradle/caches/modules-2 2>&1
          echo "--- total .gradle size"; du -sh /root/.gradle 2>&1
          echo "--- container id / hostname"; hostname; cat /etc/hostname
          echo "--- uptime"; uptime
          echo "--- mounts on /root"; mount | grep -i root || echo "no /root mount"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, lint and test
        env:
          # karoo-ext resolves only from GitHub Packages, which requires auth even though the
          # package is public. The automatic GITHUB_TOKEN is scoped to this repo and cannot read
          # another org's packages, so GPR_KEY must be a PAT with read:packages.
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: ./gradlew assembleDebug lint test
