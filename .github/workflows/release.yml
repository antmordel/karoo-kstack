name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    # Same runner pool as CI; see .github/workflows/ci.yml for why the label set is this broad.
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    env:
      # Named once: the signature check below reaches into build-tools by path, and when that
      # drifted from what is installed the step failed only after a tag had been pushed.
      ANDROID_PLATFORM: platforms;android-37.0
      ANDROID_BUILD_TOOLS: 37.0.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ${{ env.ANDROID_PLATFORM }} build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # RUNNER_TEMP is wiped between jobs, which matters here because the runner host is
          # long-lived. The explicit shred below covers a job that fails before that happens.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kstack.jks"
          test -s "$RUNNER_TEMP/kstack.jks"

      - name: Build the signed release APK
        env:
          GPR_USER: ${{ github.repository_owner }}
          GPR_KEY: ${{ secrets.GPR_KEY }}
          KEYSTORE_FILE: ${{ runner.temp }}/kstack.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Tags are vX.Y.Z; the APK carries X.Y.Z. The run number gives a versionCode that
          # only ever increases, which Android requires for an in-place update.
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_VERSION_CODE: ${{ github.run_number }}
        run: |
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          export RELEASE_VERSION
          ./gradlew assembleRelease generateManifest

      - name: Verify the APK is signed
        run: |
          # An unsigned APK builds and uploads happily, and only fails at install time on the
          # Karoo. Fail here instead, where the tag can still be moved.
          "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        # zizmor: ignore[superfluous-actions]
        # zizmor suggests `gh release` instead. The myoung34/github-runner image these
        # runners use does not ship the gh CLI, so the action is what actually works here.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/manifest.json
            app/kstack.png
            fields.png

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kstack.jks"
